# Merging to main keeps a "chore(main): release x.y.z" PR up to date (versions + CHANGELOG
# from Conventional Commits). Merging that PR tags the release and publishes to npm.
# Publishing uses npm trusted publishing (OIDC): no NPM_TOKEN secret is needed.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
