name: CI
on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        name: Install pnpm, Node.js and dependencies
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Run Tests 🧪
        run: pnpm coverage

      - name: Report coverage 📏
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          working-directory: ./packages/core
          flags: core

  Publish:
    runs-on: ubuntu-latest
    needs:
      - Test
    permissions:
      contents: write # semantic-release: create GitHub releases/tags
      issues: write # semantic-release: comment on released issues
      pull-requests: write # semantic-release: comment on released PRs
      id-token: write # required for npm OIDC trusted publishing (no NPM_TOKEN needed)
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        name: Install pnpm, Node.js and dependencies
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Publish 🚀
        run: |
          rm .npmrc
          cp ./README.md ./packages/core/README.md
          pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
